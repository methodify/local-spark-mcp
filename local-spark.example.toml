# local-spark-mcp configuration.
# Copy to `local-spark.toml` in your project working directory and edit.
# Every setting can be overridden by a LOCAL_SPARK_* environment variable.
# Nothing here is secret — auth is ambient via `az login` / DefaultAzureCredential.

[workspace]
# Set EXACTLY ONE of name or id. A name is resolved to its GUID via the Fabric
# REST API at startup.
name = "My Fabric Workspace"
# id = "00000000-0000-0000-0000-000000000000"
# env overrides: LOCAL_SPARK_WORKSPACE_NAME / LOCAL_SPARK_WORKSPACE_ID

[notebooks]
# Fabric Git export folder. run_notebook resolves relative paths and Fabric
# display names (via each item's .platform) under it; notebookutils.notebook.run
# / runMultiple resolve names the same way. env: LOCAL_SPARK_NOTEBOOKS_ROOT
# root = "fabric-git-repo/data-warehouse"

[files]
# Files mirror: /lakehouse/default/Files is a link to a local mirror of the
# default lakehouse's Files/ (shared across projects, keyed by workspace and
# lakehouse id). List the Files/ subtrees to pull at session start; unchanged
# files are skipped, so large trees (libpostal data) download once. Writes land
# locally; `sync_files(direction="push")` uploads only in writethrough mode.
# sync = ["lib/", "metadata/"]      # env: LOCAL_SPARK_FILES_SYNC="lib/,metadata/"
# mirror_root = "~/.local-spark/lakehouses"   # env: LOCAL_SPARK_MIRROR_ROOT

[lakehouses]
# All lakehouses in the workspace are registered as Spark databases by default
# (cheap — table hydration is lazy). List names here to exclude noisy ones.
exclude = []
# env override: LOCAL_SPARK_LAKEHOUSE_EXCLUDE="Staging,Sandbox"
# Default lakehouse: unqualified table names resolve here (USE <default> at
# session init), like a Fabric notebook's default lakehouse.
# default = "dataverse"   # env: LOCAL_SPARK_DEFAULT_LAKEHOUSE

[spark]
driver_memory = "8g"   # env override: LOCAL_SPARK_DRIVER_MEMORY

# Environment variables applied to BOTH the driver and the Spark Python workers.
# Use this so distributed code (mapPartitions / UDFs) can import + init the same
# native/3rd-party libs as the driver. The lib itself must be importable by the
# session's interpreter — install it into the env the server runs in (e.g.
# `uvx --with jageocoder --with postal --from git+…/local-spark-mcp local-spark-mcp`,
# or `uv pip install …` into the venv); then set its data dirs here. For a lib
# living at a path, add that path to PYTHONPATH below (works for workers; for the
# driver, prefer installing into the env).
[spark.env]
# JAGEOCODER_DB2_DIR = "/lakehouse/default/Files/lib/jageocoder"
# LIBPOSTAL_DATA_DIR = "/lakehouse/default/Files/lib/libpostal_senzing"
# PYTHONPATH = "/lakehouse/default/Files/lib"

# Arbitrary extra Spark configs (string -> string).
[spark.extra_configs]
# "spark.sql.shuffle.partitions" = "8"

[runtime]
default_sql_limit = 100   # default row cap for the run_sql tool; env: LOCAL_SPARK_SQL_LIMIT
# Write policy for lakehouse tables (env: LOCAL_SPARK_WRITE_MODE):
#   sandbox (default): nothing reaches OneLake. A table you write becomes a local
#       shallow clone (metadata only; reads stay live) and new tables land in the
#       local shadow; later reads this session see them.
#   readonly: like sandbox, but creating tables and DeltaTable.forName (MERGE)
#       are refused with a message naming this setting.
#   writethrough: writes go to OneLake; new tables land under Tables/<name>.
write_mode = "sandbox"
# persist_shadow = false  # keep shadows under <state_root>/lakehouses/<workspace-id>/
#                         # across sessions (default: deleted with the session).
#                         # env: LOCAL_SPARK_PERSIST_SHADOW
# state_root = "~/.local-spark"  # per-session warehouse + shadows; env: LOCAL_SPARK_STATE_ROOT
# warm_on_start = false   # default: lazy — Spark starts on first use (cold start
#                         # is covered by progress heartbeats, so no client timeout).
#                         # Set true to eagerly warm the JVM at launch. Leave false
#                         # when running several agents so each doesn't warm a JVM.
#                         # env: LOCAL_SPARK_WARM_ON_START
# java_home = "/path/to/jdk17"   # pin the JVM (Spark 3.5 wants Java 8/11/17); env: LOCAL_SPARK_JAVA_HOME
# token_jar_path = "/path/to/httptokenprovider_2.12-0.1.jar"  # override; default = in-repo sbt build
# hadoop_home = "C:\\hadoop"   # WINDOWS ONLY: dir containing bin\\winutils.exe.
#                              # Defaults to the copy bundled with this package;
#                              # an ambient HADOOP_HOME also wins over the bundle.
#                              # env: LOCAL_SPARK_HADOOP_HOME
# env override: LOCAL_SPARK_TOKEN_JAR_PATH
#
# OneLake auth is automatic when a [workspace] is set: the server starts a
# loopback token endpoint and wires the HttpTokenProvider jar into Spark. Build
# the jar first: `cd token-provider && sbt package` (needs Java 17 + sbt).
