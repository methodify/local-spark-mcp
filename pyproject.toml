[project]
name = "local-spark-mcp"
version = "0.8.0"
description = "MCP server giving an agent a stateful local Spark session for prototyping PySpark notebooks targeting Microsoft Fabric"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"  # fabric-1.3 profile matches Python 3.11, fabric-2.0 matches 3.13; see [project.optional-dependencies]
authors = [{ name = "Bryon" }]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    # pyspark/delta-spark come from a runtime profile extra (below); the base
    # package deliberately pins neither, so one install can't mix the two sets.
    "ipython>=8.18",
    "pandas>=2.0",   # Arrow-based toPandas / pandas UDFs, on by default as on Fabric
    "pyarrow>=14",   # Fabric Runtime 1.3 ships 14.0.2 (its packages extra pins it)
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.8",
    "azure-storage-file-datalake>=12.14",
    "httpx>=0.28.1",
]

[project.scripts]
local-spark-mcp = "local_spark_mcp.server:main"

[project.optional-dependencies]
# Runtime profiles: version sets that match a Fabric Spark runtime. Pick ONE:
#   uvx --python 3.11 --from "local-spark-mcp[fabric-1.3] @ git+https://github.com/methodify/local-spark-mcp@vX" local-spark-mcp
#   uvx --python 3.13 --from "local-spark-mcp[fabric-2.0] @ git+https://github.com/methodify/local-spark-mcp@vX" local-spark-mcp
# Keep in step with src/local_spark_mcp/profiles.py and token-provider/build.sbt.
"fabric-1.3" = [
    "pyspark==3.5.5",  # = Runtime 1.3's Spark. Not 3.5.0 (SPARK-45592 loses rows joining persisted frames); not 3.5.6+ (its V2 overwrite needs TRUNCATE, which Delta 3.2 lacks: delta-io/delta#4671)
    "delta-spark==3.2.0",
]
"fabric-2.0" = [
    "pyspark==4.1.1",  # Runtime 2.0 = Spark 4.1.1; delta-spark 4.2.0 requires pyspark <= 4.1.1
    "delta-spark==4.2.0",
]
# Fabric's notebook-facing Python packages at the runtime's versions (see
# src/local_spark_mcp/fabric_packages.py for the source file, commit and
# exclusions). Opt-in and a few hundred MB:
#   uvx --python 3.13 --from "local-spark-mcp[fabric-2.0,fabric-2.0-packages] @ git+…" local-spark-mcp
# or, into an existing environment with a per-package fallback and a report:
#   python -m local_spark_mcp.fabric_packages install
# test_fabric_packages.py keeps these lists in step with the module.
"fabric-2.0-packages" = [
    "pandas==2.3.3",
    "numpy==2.4.1",
    "pyarrow==24.0.0",
    "scipy==1.18.0; python_version >= '3.12'",  # 1.18 ships no wheels for 3.11 (the Windows fabric-2.0 Python); the installer reports the gap
