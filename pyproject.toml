[project]
name = "local-spark-mcp"
version = "0.2.2"
description = "MCP server giving an agent a stateful local Spark session for prototyping PySpark notebooks targeting Microsoft Fabric"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.12"  # matches Fabric Runtime 1.3 (Spark 3.5, Delta 3.2, Python 3.11); pyspark 3.5.0 workers break on 3.12 (Windows)
authors = [{ name = "Bryon" }]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pyspark==3.5.0",
    "delta-spark==3.2.0",
    "ipython>=8.18",
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.8",
    "azure-storage-file-datalake>=12.14",
    "httpx>=0.28.1",
]

[project.scripts]
local-spark-mcp = "local_spark_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_spark_mcp"]
# Ship the prebuilt token-provider jar so `uvx`/pip installs from GitHub work
# without sbt (Fabric/OneLake mode needs it). Rebuild via scripts/build_jar.sh.
artifacts = ["src/local_spark_mcp/jars/*.jar", "src/local_spark_mcp/winutils/bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
