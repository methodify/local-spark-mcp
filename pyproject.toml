[project]
name = "local-spark-mcp"
version = "0.3.0"
description = "MCP server giving an agent a stateful local Spark session for prototyping PySpark notebooks targeting Microsoft Fabric"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"  # fabric-1.3 profile matches Python 3.11, fabric-2.0 matches 3.13; see [project.optional-dependencies]
authors = [{ name = "Bryon" }]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    # pyspark/delta-spark come from a runtime profile extra (below); the base
    # package deliberately pins neither, so one install can't mix the two sets.
    "ipython>=8.18",
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.8",
    "azure-storage-file-datalake>=12.14",
    "httpx>=0.28.1",
]

[project.scripts]
local-spark-mcp = "local_spark_mcp.server:main"

[project.optional-dependencies]
# Runtime profiles: version sets that match a Fabric Spark runtime. Pick ONE:
#   uvx --python 3.11 --from "local-spark-mcp[fabric-1.3] @ git+https://github.com/methodify/local-spark-mcp@vX" local-spark-mcp
#   uvx --python 3.13 --from "local-spark-mcp[fabric-2.0] @ git+https://github.com/methodify/local-spark-mcp@vX" local-spark-mcp
# Keep in step with src/local_spark_mcp/profiles.py and token-provider/build.sbt.
"fabric-1.3" = [
    "pyspark==3.5.9",  # Runtime 1.3 = Spark 3.5.5; never 3.5.0 (SPARK-45592 loses rows joining persisted frames)
    "delta-spark==3.2.0",
]
"fabric-2.0" = [
    "pyspark==4.1.1",  # Runtime 2.0 = Spark 4.1.1; delta-spark 4.2.0 requires pyspark <= 4.1.1
    "delta-spark==4.2.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_spark_mcp"]
# Ship the prebuilt token-provider jar so `uvx`/pip installs from GitHub work
# without sbt (Fabric/OneLake mode needs it). Rebuild via scripts/build_jar.sh.
artifacts = ["src/local_spark_mcp/jars/*.jar", "src/local_spark_mcp/winutils/bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
